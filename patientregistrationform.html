<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.14.0-beta3/dist/css/bootstrap-select.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --hospital-blue: #0d6efd;
      --hospital-teal: #20c997;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }

    header {
      background: linear-gradient(90deg, var(--hospital-blue), var(--hospital-teal));
      color: #fff;
      padding: 0.5rem 1rem;
    }

    header h3 {
      font-size: 1.25rem;
      margin: 0;
    }

    header small {
      font-size: 0.75rem;
      opacity: 0.9;
    }

    .section-title {
      border-left: 4px solid var(--hospital-blue);
      padding-left: 8px;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .card {
      border: none;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      padding: 1rem !important;
      height: 100%;
    }

    .form-label {
      font-size: 0.8rem;
      margin-bottom: 0.15rem;
    }

    .form-label .required {
      color: #dc3545;
      margin-left: 2px;
    }

    .form-control,
    .form-select {
      font-size: 0.85rem;
      padding: 0.25rem 0.5rem;
    }

    .bootstrap-select .btn {
      font-size: 0.85rem;
      padding: 0.25rem 0.5rem;
    }

    .bootstrap-select .dropdown-menu {
      font-size: 0.85rem;
    }

    .form-check-label {
      font-size: 0.8rem;
    }

    .form-check-input {
      width: 0.9em;
      height: 0.9em;
    }
  </style>
</head>
<body>

<header class="mb-2 py-2">
  <div class="d-flex align-items-center justify-content-between">
    <div>
      <h3 class="mb-0">I-HMIS</h3>
      <small>EMR Outpatient</small>
    </div>
  </div>
</header>

<div class="container-fluid px-4">
  <form id="patientForm" class="needs-validation" novalidate>
  
    <div class="row g-4 mb-4">
      <div class="col-xl-6">
        <div class="card h-100">
          <div class="section-title">1. Patient Details</div>
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label">Surname<span class="required">*</span></label>
              <input type="text" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">First Name<span class="required">*</span></label>
              <input type="text" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Middle Name<span class="required">*</span></label>
              <input type="text" class="form-control" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Date of Birth<span class="required">*</span></label>
              <input type="date" class="form-control" id="dob" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Age</label>
              <input type="text" class="form-control" id="age" readonly>
            </div>
            <div class="col-md-3">
              <label class="form-label">Gender<span class="required">*</span></label>
              <select class="form-select" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">National ID / Passport<span class="required">*</span></label>
              <input type="text" class="form-control" id="idNumber" required>
              <div class="form-check mt-1">
                <input class="form-check-input" type="checkbox" id="noId">
                <label class="form-check-label">Patient has no ID</label>
              </div>
            </div>
            <div class="col-md-3">
              <label class="form-label">Marital Status<span class="required">*</span></label>
              <select class="form-select" required>
                <option value="">Select</option>
                <option>Single</option>
                <option>Married</option>
                <option>Divorced</option>
                <option>Widowed</option>
              </select>
            </div>
            <div class="col-md-5">
              <label class="form-label">Speciality Clinic<span class="required">*</span></label>
              <select class="form-select" required>
                <option value="">Select</option>
                <option>Casualty</option>
                <option>Clinic</option>
                <option>Consultation</option>
                <option>Corporate Clinic</option>
                <option>Dental</option>
                <option>Dopc</option>
                <option>Ent</option>
                <option>Eye</option>
                <option>Gopc</option>
                <option>MCH</option>
                <option>Mopc</option>
                <option>Occupational Therapy</option>
                <option>Opd</option>
                <option>Opd Test</option>
                <option>Orthopaedic</option>
                <option>Physiotherapy</option>
                <option>Popc</option>
                <option>Psychiatry</option>
                <option>Radiology Booking</option>
                <option>Renal Unit</option>
                <option>Sopc</option>
                <option>Testing</option>
                <option>Theatre A</option>
                <option>Youth center</option>
              </select>
            </div>
            <div class="col-md-2">
              <label class="form-label">Urgency level<span class="required">*</span></label>
              <select class="form-select" required>
                <option value="">Select</option>
                <option>Normal</option>
                <option>Emergency</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">C-Sheet No.<span class="required">*</span></label>
              <input type="text" class="form-control" required>
            </div>
            <div class="col-md-2">
              <label class="form-label">Disability<span class="required">*</span></label>
              <select class="form-select" required>
                <option value="">Select</option>
                <option>Yes</option>
                <option>No</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label">Date of Last Visit</label>
              <input type="date" class="form-control">
            </div>
            <div class="col-md-2">
              <label class="form-label">Authority<span class="required">*</span></label>
              <select class="form-select" required>
                <option value="">Select</option>
                <option>Voluntary</option>
                <option>Involuntary</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="col-xl-6">
        <div class="card h-100">
          <div class="section-title">2. Contact Details</div>
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label">Phone Number<span class="required">*</span></label>
              <input type="tel" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Alternative Phone</label>
              <input type="tel" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Email</label>
              <input type="email" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Physical Address</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">County / Town</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Country of Birth</label>
              <select class="form-select selectpicker" data-live-search="true" id="countryOfBirth">
                <option value="">Select</option>
                <option value="Kenya" selected>Kenya</option>
                <option value="Uganda">Uganda</option>
                <option value="Tanzania">Tanzania</option>
                <option value="Rwanda">Rwanda</option>
                <option value="Burundi">Burundi</option>
                <option value="Sudan">Sudan</option>
                <option value="Ethiopia">Ethiopia</option>
                <option value="Somalia">Somalia</option>
                <option value="South Sudan">South Sudan</option>
                <option value="Democratic Republic of Congo">Democratic Republic of Congo</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">County of Residence<span class="required">*</span></label>
              <select class="form-select selectpicker" data-live-search="true" id="countyResidence" required>
                <option value="">Select County</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Sub County/Location<span class="required">*</span></label>
              <select class="form-select selectpicker" data-live-search="true" id="subCounty" required>
                <option value="">Select Sub-County</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Postal Address</label>
              <input type="text" class="form-control" id="postalAddress" placeholder="e.g., 80100">
            </div>
            <div class="col-md-4">
              <label class="form-label">Postal County (Auto-detected)</label>
              <input type="text" class="form-control" id="postalCounty" readonly placeholder="County will be detected">
            </div>
            <div class="col-md-4">
              <label class="form-label">Home Village<span class="required">*</span></label>
              <input type="text" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">No of Children</label>
              <input type="number" class="form-control" min="0" max="20" step="1" value="0">
            </div>
            <div class="col-md-4">
              <label class="form-label">Nationality<span class="required">*</span></label>
              <select class="form-select selectpicker" data-live-search="true" id="nationality" required>
                <option value="">Select Nationality</option>
                <option value="Kenyan" selected>Kenyan</option>
                <option value="Ugandan">Ugandan</option>
                <option value="Tanzanian">Tanzanian</option>
                <option value="Rwandan">Rwandan</option>
                <option value="Burundian">Burundian</option>
                <option value="Sudanese">Sudanese</option>
                <option value="Ethiopian">Ethiopian</option>
                <option value="Somali">Somali</option>
                <option value="South Sudanese">South Sudanese</option>
                <option value="Congolese">Congolese</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-xl-6">
        <div class="card h-100">
          <div class="section-title">3. Next of Kin / Good Samaritan</div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="goodSamaritan">
            <label class="form-check-label">Patient brought in by Good Samaritan</label>
          </div>
          <div id="kinSection">
            <div class="row g-2">
              <div class="col-md-4">
                <label class="form-label">Full Name<span class="required">*</span></label>
                <input type="text" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Relationship<span class="required">*</span></label>
                <input type="text" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Phone Number</label>
                <input type="tel" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Physical Residence</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">Postal Address</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label">ID no.</label>
                <input type="tel" class="form-control">
              </div>
            </div>
          </div>
          <div id="goodSamaritanSection" style="display: none;">
            <div class="row g-2">
              <div class="col-md-4">
                <label class="form-label">Full Name<span class="required">*</span></label>
                <input type="text" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">Phone Number<span class="required">*</span></label>
                <input type="tel" class="form-control" required>
              </div>
              <div class="col-md-4">
                <label class="form-label">ID no.<span class="required">*</span></label>
                <input type="tel" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Physical Residence<span class="required">*</span></label>
                <input type="text" class="form-control" required>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-xl-6">
        <div class="card h-100">
          <div class="section-title">4. Other Details</div>
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label">OLD File Number (Unit Number)<span class="required">*</span></label>
              <input type="text" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">Other Numbers</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Place of Birth</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Occupation</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Patient Type</label>
              <select class="form-select">
                <option>New</option>
                <option>Returning</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Registration Service Point</label>
              <select class="form-select">
                <option value="">Select</option>
                <option>In-Patient</option>
                <option>OPD</option>
                <option>MCH</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Referred Type<span class="required">*</span></label>
              <select class="form-select" required>
                <option value="">Select</option>
                <option>County Hospital</option>
                <option>Health Center (Outside County)</option>
                <option>Health Center (Within County)</option>
                <option>Private Facility | Doctor</option>
                <option>NGO Facility</option>
                <option>Outside Country</option>
                <option>Casualty Dept at this Facility</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Referral Facility</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Referred County</label>
              <input type="text" class="form-control">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-4">
      <div class="col-xl-6">
        <div class="card h-100">
          <div class="section-title">5. Insurance</div>
          <div class="row g-2">
            <div class="col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="shaRegistered">
                <label class="form-check-label">Is patient SHA Registered?</label>
              </div>
            </div>
            <div class="col-md-6" id="shaClaimSection" style="display: none;">
              <label class="form-label">SHA Claim Number</label>
              <input type="text" class="form-control" id="shaClaimNumber">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="text-end mb-3">
      <button type="submit" class="btn btn-primary px-4">
        Register Patient
      </button>
    </div>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  function initializeCountyDropdown() {
    const countySelect = document.getElementById('countyResidence');
    if (!countySelect) return;
    
    countySelect.innerHTML = '<option value="">Select County</option>';
    
    const sortedCounties = Object.entries(kenyanCounties).sort((a, b) => a[1].localeCompare(b[1]));
    
    sortedCounties.forEach(([code, name]) => {
      const option = document.createElement('option');
      option.value = code;
      option.setAttribute('data-subtext', code);
      option.textContent = name;
      countySelect.appendChild(option);
    });
  }

  function initializeSubCountyDropdown(countyCode) {
    const subCountySelect = document.getElementById('subCounty');
    if (!subCountySelect) return;
    
    subCountySelect.innerHTML = '<option value="">Select Sub-County</option>';
    
    if (countyCode && subCountiesData[countyCode]) {
      const subCounties = subCountiesData[countyCode].sort();
      subCounties.forEach(subCounty => {
        const option = document.createElement('option');
        option.value = subCounty;
        option.textContent = subCounty;
        subCountySelect.appendChild(option);
      });
    }
    
    if (typeof $.fn.selectpicker !== 'undefined') {
      subCountySelect.classList.selectpicker('refresh');
    }
  }

  function handleCountyChange() {
    const countySelect = document.getElementById('countyResidence');
    if (!countySelect) return;
    
    const selectedCountyCode = countySelect.value;
    initializeSubCountyDropdown(selectedCountyCode);
  }

  function handlePostalCodeInput() {
    const postalInput = document.getElementById('postalAddress');
    const countyOutput = document.getElementById('postalCounty');
    
    if (!postalInput || !countyOutput) return;
    
    const postalCode = postalInput.value.trim();
    
    if (postalCode && postalCodes[postalCode]) {
      countyOutput.value = postalCodes[postalCode];
    } else {
      countyOutput.value = '';
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    initializeCountyDropdown();
    
    if (typeof $.fn.selectpicker !== 'undefined') {
      $('.selectpicker').selectpicker();
    }
    
    const countySelect = document.getElementById('countyResidence');
    if (countySelect) {
      countySelect.addEventListener('change', handleCountyChange);
    }
    
    const postalInput = document.getElementById('postalAddress');
    if (postalInput) {
      postalInput.addEventListener('input', handlePostalCodeInput);
      postalInput.addEventListener('blur', handlePostalCodeInput);
    }
  });

  document.getElementById("dob").addEventListener("change", function () {
    const dob = new Date(this.value);
    const diff = Date.now() - dob.getTime();
    const age = new Date(diff).getUTCFullYear() - 1970;
    document.getElementById("age").value = age > 0 ? age : "";
  });

  document.getElementById("noId").addEventListener("change", function () {
    const idField = document.getElementById("idNumber");
    idField.disabled = this.checked;
    idField.value = "";
  });

  document.getElementById("goodSamaritan").addEventListener("change", function () {
    const kinSection = document.getElementById("kinSection");
    const goodSamaritanSection = document.getElementById("goodSamaritanSection");
    
    if (this.checked) {
      kinSection.style.display = "none";
      goodSamaritanSection.style.display = "block";
    } else {
      kinSection.style.display = "block";
      goodSamaritanSection.style.display = "none";
    }
  });

  document.getElementById("shaRegistered").addEventListener("change", function () {
    document.getElementById("shaClaimSection").style.display =
      this.checked ? "block" : "none";
  });

  (() => {
    const form = document.getElementById("patientForm");
    form.addEventListener("submit", event => {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add("was-validated");
    });
  })();
