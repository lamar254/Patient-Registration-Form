<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient Registration</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --hospital-blue: #0d6efd;
      --hospital-teal: #20c997;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
    }

    header {
      background: linear-gradient(90deg, var(--hospital-blue), var(--hospital-teal));
      color: #fff;
      padding: 1.5rem;
    }

    .section-title {
      border-left: 5px solid var(--hospital-blue);
      padding-left: 10px;
      margin-bottom: 1rem;
      font-weight: 600;
    }

    .card {
      border: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }
  </style>
</head>

<body>

<header class="mb-4">
  <h3 class="mb-0">I-HMIS</h3>
  <small>EMR Outpatient</small>
</header>

<div class="container mb-5">
  <form id="patientForm" class="needs-validation" novalidate>

    //Patient Bio Data
    <div class="card mb-4 p-4">
      <div class="section-title">1. Patient Bio Data</div>

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">First Name</label>
          <input type="text" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Middle Name</label>
          <input type="text" class="form-control">
        </div>

        <div class="col-md-4">
          <label class="form-label">Last Name</label>
          <input type="text" class="form-control" required>
        </div>

        <div class="col-md-3">
          <label class="form-label">Date of Birth</label>
          <input type="date" class="form-control" id="dob" required>
        </div>

        <div class="col-md-2">
          <label class="form-label">Age</label>
          <input type="text" class="form-control" id="age" readonly>
        </div>

        <div class="col-md-3">
          <label class="form-label">Gender</label>
          <select class="form-select" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">National ID / Passport</label>
          <input type="text" class="form-control" id="idNumber">
          <div class="form-check mt-1">
            <input class="form-check-input" type="checkbox" id="noId">
            <label class="form-check-label">Patient has no ID</label>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. CONTACT DETAILS -->
    <div class="card mb-4 p-4">
      <div class="section-title">2. Contact Details</div>

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Alternative Phone</label>
          <input type="tel" class="form-control">
        </div>

        <div class="col-md-4">
          <label class="form-label">Email</label>
          <input type="email" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">Physical Address</label>
          <input type="text" class="form-control">
        </div>

        <div class="col-md-6">
          <label class="form-label">County / Town</label>
          <input type="text" class="form-control">
        </div>
      </div>
    </div>

    <!-- 3. NEXT OF KIN / GOOD SAMARITAN -->
    <div class="card mb-4 p-4">
      <div class="section-title">3. Next of Kin / Good Samaritan</div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="goodSamaritan">
        <label class="form-check-label">
          Patient brought in by Good Samaritan
        </label>
      </div>

      <div id="kinSection">
        <div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control">
          </div>

          <div class="col-md-4">
            <label class="form-label">Relationship</label>
            <input type="text" class="form-control">
          </div>

          <div class="col-md-4">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control">
          </div>
        </div>
      </div>
    </div>

    <!-- 4. OTHER DETAILS -->
    <div class="card mb-4 p-4">
      <div class="section-title">4. Other Details</div>

      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Marital Status</label>
          <select class="form-select">
            <option>Single</option>
            <option>Married</option>
            <option>Divorced</option>
            <option>Widowed</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Occupation</label>
          <input type="text" class="form-control">
        </div>

        <div class="col-md-4">
          <label class="form-label">Patient Type</label>
          <select class="form-select">
            <option>New</option>
            <option>Returning</option>
          </select>
        </div>
      </div>
    </div>

    <div class="text-end">
      <button type="submit" class="btn btn-primary px-4">
        Register Patient
      </button>
    </div>

  </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // Age calculation
  document.getElementById("dob").addEventListener("change", function () {
    const dob = new Date(this.value);
    const diff = Date.now() - dob.getTime();
    const age = new Date(diff).getUTCFullYear() - 1970;
    document.getElementById("age").value = age > 0 ? age : "";
  });

  // No ID toggle
  document.getElementById("noId").addEventListener("change", function () {
    const idField = document.getElementById("idNumber");
    idField.disabled = this.checked;
    idField.value = "";
  });

  // Good Samaritan toggle
  document.getElementById("goodSamaritan").addEventListener("change", function () {
    document.getElementById("kinSection").style.display =
      this.checked ? "none" : "block";
  });

  // Bootstrap validation
  (() => {
    const form = document.getElementById("patientForm");
    form.addEventListener("submit", event => {
      if (!form.checkValidity()) {
        event.preventDefault();
        event.stopPropagation();
      }
      form.classList.add("was-validated");
    });
  })();
</script>

</body>
</html>
